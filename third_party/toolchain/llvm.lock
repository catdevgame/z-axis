# The compiler and linker the app bundles to build each game's code on the player's machine (game modules,
# runtime/game_module.h): LLVM's clang and lld, Apache-2.0 WITH LLVM-exception. One source release, pinned by its
# SHA-256 (github.com/llvm/llvm-project/releases), built by build-llvm.sh / build-llvm.ps1 into one stripped program
# per host (clang and lld, the AArch64 and X86 targets only) and the headers a module's compile
# reaches. The built archives are kept in the workshop's archive store (by name and hash, never in the tree), named <version>-<host>-<recipe>.tar.xz (<recipe>: the hash of the build's
# configuration, build-llvm.sh CFG / build-llvm.ps1 $cfg); each host's line below pins its archive: archive-HOST NAME SHA256 BYTES. NAME VALUE per line.
